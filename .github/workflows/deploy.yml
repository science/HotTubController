name: Deploy to cPanel

on:
  push:
    branches: [production]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install PHP dependencies (production only)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install backend dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader

      # Build frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate build metadata
        id: build_date
        run: |
          echo "date=$(date '+%b %d, %Y')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Build frontend
        env:
          VITE_GIT_SHA: ${{ steps.build_date.outputs.sha_short }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_BUILD_DATE: ${{ steps.build_date.outputs.date }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          cd frontend
          npm run build

      # Generate backend .env from secrets
      - name: Create backend .env
        run: |
          cat > backend/.env << 'EOF'
          APP_ENV=production
          EXTERNAL_API_MODE=live
          API_BASE_URL=${{ vars.API_BASE_URL }}
          IFTTT_WEBHOOK_KEY=${{ secrets.IFTTT_WEBHOOK_KEY }}
          IOT_API_URL=${{ secrets.IOT_API_URL }}
          IOT_API_JWT=${{ secrets.IOT_API_JWT }}
          AUTH_ADMIN_USERNAME=${{ secrets.AUTH_ADMIN_USERNAME }}
          AUTH_ADMIN_PASSWORD=${{ secrets.AUTH_ADMIN_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ secrets.JWT_EXPIRY_HOURS }}
          WIRELESSTAG_OAUTH_TOKEN=${{ secrets.WIRELESSTAG_OAUTH_TOKEN }}
          WIRELESSTAG_DEVICE_ID=${{ secrets.WIRELESSTAG_DEVICE_ID }}
          HEALTHCHECKS_IO_KEY=${{ secrets.HEALTHCHECKS_IO_KEY }}
          HEALTHCHECKS_IO_CHANNEL=${{ secrets.HEALTHCHECKS_IO_CHANNEL }}
          # ESP32 Temperature Sensor
          ESP32_API_KEY=${{ secrets.ESP32_API_KEY }}
          # Optional Features
          BLINDS_FEATURE_ENABLED=true
          EOF

      # Generate CRON_JWT for scheduled job authentication
      - name: Generate CRON JWT
        run: php backend/bin/generate-cron-jwt.php

      # Ensure scripts are executable before deploy
      # FTP doesn't preserve Unix permissions, so we need to set them explicitly
      - name: Set executable permissions on scripts
        run: |
          chmod +x backend/storage/bin/cron-runner.sh
          chmod +x backend/storage/bin/rotate-logs.php
          chmod +x backend/storage/bin/log-rotation-cron.sh

      # Deploy backend via FTP
      - name: Deploy backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./backend/
          server-dir: /public_html/tub/backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/config/env.*
            **/.env.example
            **/phpunit.xml

      # Fix permissions on scripts via FTP SITE CHMOD command
      # Note: This may fail on some hosts that don't support SITE CHMOD
      - name: Fix script permissions via FTP
        run: |
          curl -k --ftp-ssl \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}" \
            -Q "SITE CHMOD 755 /public_html/tub/backend/storage/bin/cron-runner.sh" \
            -Q "SITE CHMOD 755 /public_html/tub/backend/storage/bin/rotate-logs.php" \
            -Q "SITE CHMOD 755 /public_html/tub/backend/storage/bin/log-rotation-cron.sh" \
            || echo "Warning: SITE CHMOD may not be supported - permissions may need manual fix"

      # Deploy frontend via FTP
      - name: Deploy frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./frontend/build/
          server-dir: /public_html/tub/
          state-name: .ftp-deploy-sync-state-frontend.json
          exclude: |
            **/.git*
            **/.git*/**

      # Verify the deployed frontend can actually cold-start.
      #
      # On 2026-08-25 a deploy left every browser holding a cached index.html
      # pointing at bundles the deploy had removed. The SPA rewrite answered
      # those requests with index.html at HTTP 200, the browser refused to
      # execute HTML as a module, and the app showed a black screen with no
      # error. Nothing in CI noticed; it surfaced as "the hot tub is down".
      # These assertions are what make that a failed build instead.
      - name: Smoke test deployed frontend
        run: |
          set -uo pipefail
          SITE="$(printf '%s' "${{ vars.API_BASE_URL }}" | sed 's#/backend/public/*$##')"
          echo "Site root: $SITE"
          fail=0
          check() {  # check <label> <condition-result>
            if [ "$2" = "0" ]; then echo "  ok    $1"; else echo "  FAIL  $1"; fail=1; fi
          }

          # 1. The shell loads.
          hdr=$(curl -sS --max-time 30 -D- -o /tmp/index.html -w '%{http_code}' "$SITE/")
          code=$(printf '%s' "$hdr" | tail -n1)
          [ "$code" = "200" ]; check "index.html returns 200 (got $code)" $?

          # 2. It must not be served from cache without revalidating, or the
          #    next deploy strands every client that already has a copy.
          printf '%s' "$hdr" | grep -iq 'cache-control:.*no-cache'
          check "index.html sends Cache-Control: no-cache" $?

          # 3. Every bundle the shell names must exist AND be served as
          #    JavaScript. A 200 of type text/html here is the exact failure.
          refs=$(grep -o '/_app/immutable/[A-Za-z0-9._/-]*\.js' /tmp/index.html | sort -u)
          [ -n "$refs" ]; check "index.html references at least one bundle" $?
          for ref in $refs; do
            url="$SITE$ref"
            ct=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}:%{content_type}' "$url")
            case "$ct" in
              200:*javascript*) echo "  ok    $ref" ;;
              *) echo "  FAIL  $ref -> $ct"; fail=1 ;;
            esac
          done

          # 4. The manifest is the whole of this app's PWA behaviour -- install,
          #    standalone launch, icons. The E2E suite asserts its content type
          #    but only ever runs against the dev server, so check the real one.
          mf=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}:%{content_type}' \
            "$SITE/manifest.webmanifest")
          case "$mf" in
            200:application/manifest+json*) echo "  ok    manifest content type" ;;
            *) echo "  FAIL  manifest content type -> $mf"; fail=1 ;;
          esac

          # 5. A bundle that is genuinely gone must 404 rather than be masked
          #    by the SPA fallback, so a stale client fails loudly and its
          #    boot watchdog can recover it.
          gone=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "$SITE/_app/immutable/entry/start.THIS-DOES-NOT-EXIST.js")
          [ "$gone" = "404" ]; check "missing bundle returns 404 (got $gone)" $?

          if [ "$fail" != "0" ]; then
            echo "::error::Deployed frontend failed its cold-start smoke test"
            exit 1
          fi
          echo "Frontend smoke test passed"

      # Set up maintenance infrastructure (cron + healthcheck monitoring)
      # This calls the deployed API to create cron jobs and healthchecks.io monitoring
      - name: Setup maintenance cron and monitoring
        run: |
          # Read CRON_JWT from the .env file we generated earlier
          CRON_JWT=$(grep '^CRON_JWT=' backend/.env | cut -d'=' -f2-)

          echo "Calling cron health endpoint..."
          # Note: -d '{}' is required - ModSecurity blocks POST requests without a body
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ vars.API_BASE_URL }}/api/cron/health" \
            -H "Authorization: Bearer $CRON_JWT" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 30)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cron health setup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Cron health setup completed successfully"
